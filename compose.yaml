# Redis is the only sidecar. LLM and embeddings are separate OpenAI-compatible
# HTTP services — set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL and EMBEDDING_*.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-27b-fp8}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    volumes:
      - audit-data:/data
    depends_on:
      - redis

volumes:
  audit-data:
