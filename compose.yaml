# Redis is the only sidecar. LLM and embeddings are separate OpenAI-compatible
# HTTP services — set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL and EMBEDDING_*.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - audit-data:/data
    depends_on:
      - redis

volumes:
  audit-data:
