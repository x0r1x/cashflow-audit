# Project-scoped Grok permissions for cashflow-audit.
# Only [permission] (and MCP/plugin tables) is read from this file.
# deny always wins over allow.

[permission]
allow = [
  # In-repo reads, searches, and edits (cwd-scoped; . / .. are collapsed)
  "Read(./**)",
  "Edit(./**)",
  "Write(./**)",
  "Grep",

  # Git inspection (push is denied below; deny wins)
  "Bash(git *)",

  # Tests
  "Bash(pytest *)",
  "Bash(python -m pytest *)",
  "Bash(python -m unittest *)",

  # Lint / format / types
  "Bash(ruff *)",
  "Bash(python -m ruff *)",
  "Bash(mypy *)",
  "Bash(python -m mypy *)",
]

deny = [
  # --- secrets (any depth, including outside the repo) ---
  "Read(**/.env)",
  "Edit(**/.env)",
  "Write(**/.env)",
  "Read(**/.env.local)",
  "Edit(**/.env.local)",
  "Write(**/.env.local)",
  "Read(**/.env.production)",
  "Edit(**/.env.production)",
  "Write(**/.env.production)",
  "Read(**/.env.development)",
  "Edit(**/.env.development)",
  "Write(**/.env.development)",
  "Read(**/.netrc)",
  "Edit(**/.netrc)",
  "Write(**/.netrc)",
  "Read(**/.npmrc)",
  "Edit(**/.npmrc)",
  "Write(**/.npmrc)",
  "Read(**/*.pem)",
  "Edit(**/*.pem)",
  "Write(**/*.pem)",
  "Read(**/*.key)",
  "Edit(**/*.key)",
  "Write(**/*.key)",
  "Read(**/*.p12)",
  "Edit(**/*.p12)",
  "Write(**/*.p12)",
  "Read(**/*.pfx)",
  "Edit(**/*.pfx)",
  "Write(**/*.pfx)",
  "Read(**/id_rsa)",
  "Edit(**/id_rsa)",
  "Write(**/id_rsa)",
  "Read(**/id_ed25519)",
  "Edit(**/id_ed25519)",
  "Write(**/id_ed25519)",
  "Read(**/credentials*)",
  "Edit(**/credentials*)",
  "Write(**/credentials*)",
  "Read(**/*secret*)",
  "Edit(**/*secret*)",
  "Write(**/*secret*)",
  "Read(**/.ssh/**)",
  "Edit(**/.ssh/**)",
  "Write(**/.ssh/**)",
  "Read(**/.aws/**)",
  "Edit(**/.aws/**)",
  "Write(**/.aws/**)",
  "Read(**/.gnupg/**)",
  "Edit(**/.gnupg/**)",
  "Write(**/.gnupg/**)",

  # --- no writes outside this project (absolute OS paths) ---
  "Edit(/etc/**)",
  "Write(/etc/**)",
  "Edit(/usr/**)",
  "Write(/usr/**)",
  "Edit(/bin/**)",
  "Write(/bin/**)",
  "Edit(/sbin/**)",
  "Write(/sbin/**)",
  "Edit(/opt/**)",
  "Write(/opt/**)",
  "Edit(/System/**)",
  "Write(/System/**)",
  "Edit(/Library/**)",
  "Write(/Library/**)",
  "Edit(/private/**)",
  "Write(/private/**)",
  "Edit(/Volumes/**)",
  "Write(/Volumes/**)",
  "Edit(/Users/alekseykashin/.ssh/**)",
  "Write(/Users/alekseykashin/.ssh/**)",
  "Edit(/Users/alekseykashin/.aws/**)",
  "Write(/Users/alekseykashin/.aws/**)",
  "Edit(/Users/alekseykashin/.gnupg/**)",
  "Write(/Users/alekseykashin/.gnupg/**)",
  "Edit(/Users/alekseykashin/.config/**)",
  "Write(/Users/alekseykashin/.config/**)",
  "Edit(/Users/alekseykashin/Library/**)",
  "Write(/Users/alekseykashin/Library/**)",
  "Edit(/Users/alekseykashin/*)",
  "Write(/Users/alekseykashin/*)",

  # --- git publish / rewrite ---
  "Bash(git push*)",
  "Bash(git push *)",
  "Bash(git push --force*)",
  "Bash(git push -f*)",
  "Bash(git push --force-with-lease*)",
  "Bash(git reset --hard*)",
  "Bash(git clean*)",
  "Bash(git filter-branch*)",
  "Bash(git filter-repo*)",
  "Bash(git update-ref*)",

  # --- destructive shell ---
  "Bash(rm -rf *)",
  "Bash(rm -r *)",
  "Bash(rm -fr *)",
  "Bash(rm --recursive *)",
  "Bash(sudo *)",
  "Bash(mkfs *)",
  "Bash(dd *)",
  "Bash(shred *)",
  "Bash(chmod *)",
  "Bash(chown *)",
  "Bash(chgrp *)",
  "Bash(chattr *)",
  "Bash(diskutil *)",
  "Bash(launchctl *)",
  "Bash(kill *)",
  "Bash(pkill *)",
  "Bash(killall *)",
  "Bash(reboot*)",
  "Bash(shutdown *)",
  "Bash(halt *)",
]
