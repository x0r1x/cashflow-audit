[project]
name = "cashflow-audit"
version = "0.1.0"
description = "Audit service for Excel CashFlow models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=5.3",
    "numpy>=2.5.2",
    "openai>=3.8.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.1",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
cashflow-audit = "cashflow_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashflow_audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/cashflow_audit/ontology/taxonomy.yaml" = "cashflow_audit/ontology/taxonomy.yaml"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "redis: needs a Redis instance",
    "live_llm: calls a real LLM or embedding endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
